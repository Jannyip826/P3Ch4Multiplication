<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘數爬山大挑戰（筆算直式版）</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Custom digit input grid alignment */
        .math-grid {
            display: grid;
            grid-template-columns: repeat(6, 3.2rem);
            justify-content: end;
            gap: 0.35rem;
        }
        @media (max-width: 640px) {
            .math-grid {
                grid-template-columns: repeat(6, 2.5rem);
                gap: 0.2rem;
            }
        }
        .carry-input {
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 9999px;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.2s ease;
        }
        @media (max-width: 640px) {
            .carry-input {
                width: 1.8rem;
                height: 1.8rem;
                font-size: 0.95rem;
            }
        }
        .digit-box {
            width: 3.2rem;
            height: 3.6rem;
            border-radius: 0.6rem;
            text-align: center;
            font-weight: 800;
            font-size: 1.75rem;
            outline: none;
            transition: all 0.2s ease;
        }
        @media (max-width: 640px) {
            .digit-box {
                width: 2.5rem;
                height: 3rem;
                font-size: 1.35rem;
            }
        }
        /* Pulse & Bounce animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes stepBounce {
            0%, 100% { transform: scale(0.72) translateY(0); }
            50% { transform: scale(0.72) translateY(-10px); }
        }
        .animate-step {
            animation: stepBounce 0.35s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center justify-between p-2 sm:p-4">

    <!-- Top Header Bar -->
    <header class="w-full max-w-5xl bg-white rounded-2xl shadow-md p-3 sm:p-4 mb-3 flex flex-wrap items-center justify-between gap-2 border border-slate-200">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 text-white w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center shadow-md">
                <i class="fa-solid fa-[#fa8c16] fa-mountain-sun text-xl sm:text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-2xl font-black text-slate-800 tracking-wide">乘數爬山大挑戰</h1>
                <p class="text-xs sm:text-sm text-slate-500 font-semibold">玉山主峰攻頂版（筆算直式）</p>
            </div>
        </div>

        <!-- Level Selector & Controls -->
        <div class="flex items-center space-x-2 sm:space-x-3">
            <select id="levelSelect" onchange="changeLevel(this.value)" class="bg-slate-100 font-bold text-xs sm:text-sm text-slate-700 px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none cursor-pointer">
                <option value="1">第一關：2位數 × 1位數</option>
                <option value="2">第二關：3位數 × 1位數</option>
                <option value="3">第三關：4位數 × 1位數</option>
            </select>

            <button onclick="toggleSound()" id="soundBtn" class="w-9 h-9 sm:w-10 sm:h-10 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl flex items-center justify-center font-bold transition shadow-sm" title="開關音效">
                <i id="soundIcon" class="fa-solid fa-volume-high text-base sm:text-lg"></i>
            </button>

            <button onclick="openAvatarModal()" class="w-9 h-9 sm:w-10 sm:h-10 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-xl flex items-center justify-center font-bold transition shadow-sm" title="角色設定">
                <i class="fa-solid fa-user-gear text-base sm:text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Playground Container -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1">

        <!-- Left Column: Mountain Map & Altitude Progress (5 cols) -->
        <section class="lg:col-span-5 bg-white rounded-2xl shadow-md p-4 border border-slate-200 flex flex-col items-center justify-between relative overflow-hidden">
            <!-- Altitude Info Card -->
            <div class="w-full flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 mb-2">
                <div>
                    <span class="text-xs text-slate-400 font-bold block">目標頂峰</span>
                    <span class="text-sm font-extrabold text-amber-600">玉山主峰 3,952m</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 font-bold block">當前海拔</span>
                    <span id="altitudeText" class="text-lg font-black text-emerald-600">0 m</span>
                </div>
            </div>

            <!-- SVG Mountain Trail Canvas -->
            <div class="relative w-full h-[320px] sm:h-[400px] bg-gradient-to-b from-sky-200 via-sky-100 to-emerald-50 rounded-xl overflow-hidden border border-slate-200 shadow-inner">
                <svg id="mountainSvg" viewBox="0 0 400 500" class="w-full h-full preserve-3d">
                    <defs>
                        <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#475569"/>
                            <stop offset="40%" stop-color="#334155"/>
                            <stop offset="100%" stop-color="#1e293b"/>
                        </linearGradient>
                        <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="100%" stop-color="#cbd5e1"/>
                        </linearGradient>
                    </defs>

                    <!-- Background Mountains -->
                    <polygon points="200,60 380,480 20,480" fill="url(#mountainGrad)" />
                    <polygon points="200,60 260,160 140,160" fill="url(#snowGrad)" opacity="0.9" />

                    <!-- Peak Flag -->
                    <g transform="translate(200, 45)">
                        <line x1="0" y1="0" x2="0" y2="25" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
                        <polygon points="0,0 18,6 0,12" fill="#f43f5e"/>
                        <circle cx="0" cy="0" r="3" fill="#f59e0b"/>
                    </g>

                    <!-- Altitude Milestones -->
                    <text x="215" y="65" font-size="11" font-weight="bold" fill="#0f172a">3,952m 頂峰</text>
                    <text x="250" y="220" font-size="10" font-weight="bold" fill="#475569">2,500m</text>
                    <text x="110" y="360" font-size="10" font-weight="bold" fill="#475569">1,000m</text>

                    <!-- Winding Trail Path (Yellow Trail) -->
                    <path id="trailPath" d="M 80,460 C 180,450 320,410 290,360 C 260,310 110,330 130,270 C 150,210 310,230 260,170 C 220,120 210,100 200,70" 
                          fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>

                    <!-- Climber Character Avatar Container -->
                    <g id="climberGroup" transform="translate(80, 460)">
                        <!-- Dynamically Rendered SVG Avatar with Scale 0.72 -->
                        <g id="avatarSvgContainer" transform="scale(0.72) translate(-25, -55)">
                            <!-- Dynamic Content Rendered by JS -->
                        </g>
                    </g>
                </svg>

                <!-- Step Counter Badge -->
                <div class="absolute bottom-2 left-2 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full border border-slate-300 text-xs font-bold text-slate-700 shadow-sm">
                    第 <span id="currentStepText" class="text-amber-600 text-sm">0</span> / <span id="totalStepsText">10</span> 步
                </div>
            </div>
        </section>

        <!-- Right Column: Vertical Arithmetic Canvas & Numeric Keypad (7 cols) -->
        <section class="lg:col-span-7 bg-white rounded-2xl shadow-md p-4 border border-slate-200 flex flex-col justify-between items-center">
            
            <!-- Question Banner -->
            <div class="w-full flex justify-between items-center mb-3">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">筆算直式演算區</span>
                <span id="statusMessage" class="text-sm font-bold text-amber-600 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                    請由個位開始計算
                </span>
            </div>

            <!-- Pure White Math Vertical Algorithm Workspace (bg-white, NO column labels) -->
            <div class="w-full bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 flex flex-col items-center justify-center my-auto min-h-[240px] shadow-sm relative overflow-x-auto">
                
                <!-- Math Form Container -->
                <div id="mathWorkspace" class="flex flex-col items-end select-none">
                    <!-- Dynamic Math Content injected by JavaScript -->
                </div>

            </div>

            <!-- Large Screen Keypad & Action Row -->
            <div class="w-full mt-4 space-y-2">
                <!-- On-Screen Numeric Keypad -->
                <div class="grid grid-cols-5 gap-2 max-w-md mx-auto">
                    <button onclick="pressKey('1')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-amber-400 active:text-white rounded-xl text-xl font-black text-slate-800 shadow-sm transition">1</button>
                    <button onclick="pressKey('2')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-amber-400 active:text-white rounded-xl text-xl font-black text-slate-800 shadow-sm transition">2</button>
                    <button onclick="pressKey('3')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-amber-400 active:text-white rounded-xl text-xl font-black text-slate-800 shadow-sm transition">3</button>
                    <button onclick="pressKey('4')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-amber-400 active:text-white rounded-xl text-xl font-black text-slate-800 shadow-sm transition">4</button>
                    <button onclick="pressKey('5')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-amber-400 active:text-white rounded-xl text-xl font-black text-slate-800 shadow-sm transition">5</button>
                    
                    <button onclick="pressKey('6')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-amber-400 active:text-white rounded-xl text-xl font-black text-slate-800 shadow-sm transition">6</button>
                    <button onclick="pressKey('7')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-amber-400 active:text-white rounded-xl text-xl font-black text-slate-800 shadow-sm transition">7</button>
                    <button onclick="pressKey('8')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-amber-400 active:text-white rounded-xl text-xl font-black text-slate-800 shadow-sm transition">8</button>
                    <button onclick="pressKey('9')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-amber-400 active:text-white rounded-xl text-xl font-black text-slate-800 shadow-sm transition">9</button>
                    <button onclick="pressKey('0')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-amber-400 active:text-white rounded-xl text-xl font-black text-slate-800 shadow-sm transition">0</button>
                </div>

                <!-- Action Controls -->
                <div class="flex gap-2 max-w-md mx-auto">
                    <button onclick="pressBackspace()" class="flex-1 h-12 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl border border-rose-200 flex items-center justify-center gap-2 transition active:scale-95">
                        <i class="fa-solid fa-backspace"></i> 刪除
                    </button>
                    <button onclick="checkCurrentAnswer()" id="checkBtn" class="flex-[2] h-12 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-extrabold text-lg rounded-xl shadow-md flex items-center justify-center gap-2 transition active:scale-95">
                        <i class="fa-solid fa-circle-check"></i> 檢查答案
                    </button>
                </div>
            </div>

        </section>
    </main>

    <!-- Avatar Customization Modal -->
    <div id="avatarModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 flex flex-col items-center">
            <h2 class="text-xl font-black text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-astronaut text-amber-500"></i> 選擇登山裝備與角色
            </h2>

            <!-- Role Selection -->
            <div class="w-full mb-4">
                <label class="text-xs font-extrabold text-slate-400 uppercase mb-2 block">角色造型</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setAvatarRole('boy')" id="roleBtn-boy" class="p-2 border-2 rounded-xl text-center font-bold text-sm transition">活力男孩</button>
                    <button onclick="setAvatarRole('girl')" id="roleBtn-girl" class="p-2 border-2 rounded-xl text-center font-bold text-sm transition">探險女孩</button>
                    <button onclick="setAvatarRole('explorer')" id="roleBtn-explorer" class="p-2 border-2 rounded-xl text-center font-bold text-sm transition">野外專家</button>
                </div>
            </div>

            <!-- Jacket Color Selection -->
            <div class="w-full mb-6">
                <label class="text-xs font-extrabold text-slate-400 uppercase mb-2 block">夾克色彩</label>
                <div class="flex justify-between items-center gap-2">
                    <button onclick="setJacketColor('#f97316')" class="w-10 h-10 rounded-full bg-orange-500 ring-2 ring-offset-2 ring-transparent focus:ring-slate-400"></button>
                    <button onclick="setJacketColor('#0284c7')" class="w-10 h-10 rounded-full bg-sky-600 ring-2 ring-offset-2 ring-transparent focus:ring-slate-400"></button>
                    <button onclick="setJacketColor('#10b981')" class="w-10 h-10 rounded-full bg-emerald-500 ring-2 ring-offset-2 ring-transparent focus:ring-slate-400"></button>
                    <button onclick="setJacketColor('#f43f5e')" class="w-10 h-10 rounded-full bg-rose-500 ring-2 ring-offset-2 ring-transparent focus:ring-slate-400"></button>
                    <button onclick="setJacketColor('#8b5cf6')" class="w-10 h-10 rounded-full bg-purple-500 ring-2 ring-offset-2 ring-transparent focus:ring-slate-400"></button>
                </div>
            </div>

            <button onclick="closeAvatarModal()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-extrabold rounded-xl shadow-md transition">
                完成設定
            </button>
        </div>
    </div>

    <!-- Summit Celebration Modal -->
    <div id="summitModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl text-center border border-amber-200 animate-bounce-once">
            <div class="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-amber-300">
                <i class="fa-solid fa-trophy text-4xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-1">恭喜成功登頂！</h2>
            <p class="text-slate-500 text-sm font-bold mb-4">你已成功征服台灣最高峰 — 玉山主峰 3,952m！</p>

            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 mb-6 text-left space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-500 font-bold">挑戰關卡:</span>
                    <span id="modalLevelText" class="font-black text-slate-800">第一關</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-500 font-bold">完成題數:</span>
                    <span id="modalCompletedQuestions" class="font-black text-slate-800">0 題</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-500 font-bold">獲得榮譽徽章:</span>
                    <span class="font-black text-amber-600"><i class="fa-solid fa-medal"></i> 玉山登山勇士</span>
                </div>
            </div>

            <div class="flex gap-2">
                <button id="nextLevelBtn" onclick="goToNextLevel()" class="hidden flex-1 py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-black text-lg rounded-xl shadow-lg transition">
                    進入下一關
                </button>
                <button onclick="restartChallenge()" class="flex-1 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg rounded-xl shadow-lg transition">
                    再玩一次
                </button>
            </div>
        </div>
    </div>

    <script>
        /* State Variables */
        let currentLevel = 1;
        let currentStep = 0; // 0 to 10 steps
        let totalSteps = 10; // Incorrect answers add one required question
        let soundEnabled = true;

        let avatarConfig = {
            role: 'boy', // 'boy', 'girl', 'explorer'
            jacketColor: '#f97316'
        };

        // Problem state
        let currentProblem = null;
        let inputFocusOrder = []; // Array of field IDs in logical right-to-left sequence
        let currentFocusIndex = 0;
        let isCorrectionMode = false;

        /* Web Audio API Synthesizer */
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'key') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'step') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'correct') {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.12, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.25);
                    });
                } else if (type === 'error') {
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc1.type = 'sawtooth';
                    osc2.type = 'sawtooth';
                    osc1.frequency.setValueAtTime(160, now);
                    osc2.frequency.setValueAtTime(168, now);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(ctx.destination);
                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + 0.3);
                    osc2.stop(now + 0.3);
                } else if (type === 'victory') {
                    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.4);
                    });
                }
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-base sm:text-lg';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-base sm:text-lg text-rose-500';
            }
        }

        /* SVG Avatar Renderer */
        function renderAvatarSvg() {
            const container = document.getElementById('avatarSvgContainer');
            const color = avatarConfig.jacketColor;

            let hatHairSvg = '';
            if (avatarConfig.role === 'boy') {
                hatHairSvg = `
                    <!-- Boy Hair -->
                    <path d="M 15 22 Q 25 8 35 22 Q 25 15 15 22" fill="#334155"/>
                    <circle cx="25" cy="18" r="10" fill="#334155"/>
                `;
            } else if (avatarConfig.role === 'girl') {
                hatHairSvg = `
                    <!-- Girl Hair & Ponytail -->
                    <path d="M 12 25 C 10 10 40 10 38 25" fill="#1e293b"/>
                    <path d="M 35 25 C 42 22 45 35 40 40 C 36 35 34 28 35 25" fill="#1e293b"/>
                `;
            } else if (avatarConfig.role === 'explorer') {
                hatHairSvg = `
                    <!-- Explorer Safari Hat -->
                    <path d="M 8 20 C 12 8 38 8 42 20 Z" fill="#b45309"/>
                    <ellipse cx="25" cy="20" rx="20" ry="4" fill="#d97706"/>
                `;
            }

            container.innerHTML = `
                <g class="climber-body">
                    <!-- Backpack -->
                    <rect x="8" y="28" width="10" height="18" rx="3" fill="#047857"/>
                    
                    <!-- Jacket / Body -->
                    <rect x="16" y="26" width="18" height="20" rx="4" fill="${color}"/>
                    
                    <!-- Face & Head -->
                    <circle cx="25" cy="20" r="9" fill="#fde047"/>
                    <!-- Eyes -->
                    <circle cx="22" cy="19" r="1.2" fill="#0f172a"/>
                    <circle cx="27" cy="19" r="1.2" fill="#0f172a"/>
                    <!-- Smile -->
                    <path d="M 22 23 Q 25 26 28 23" stroke="#0f172a" stroke-width="1" fill="none" stroke-linecap="round"/>

                    ${hatHairSvg}

                    <!-- Legs -->
                    <rect x="18" y="46" width="5" height="12" rx="2" fill="#1e293b"/>
                    <rect x="27" y="46" width="5" height="12" rx="2" fill="#1e293b"/>
                    <!-- Boots -->
                    <rect x="16" y="55" width="7" height="5" rx="2" fill="#78350f"/>
                    <rect x="27" y="55" width="7" height="5" rx="2" fill="#78350f"/>
                </g>
            `;
        }

        function setAvatarRole(role) {
            avatarConfig.role = role;
            updateAvatarUI();
        }

        function setJacketColor(color) {
            avatarConfig.jacketColor = color;
            updateAvatarUI();
        }

        function updateAvatarUI() {
            ['boy', 'girl', 'explorer'].forEach(r => {
                const btn = document.getElementById(`roleBtn-${r}`);
                if (r === avatarConfig.role) {
                    btn.className = 'p-2 border-2 border-amber-500 bg-amber-50 text-amber-800 font-extrabold text-sm rounded-xl transition';
                } else {
                    btn.className = 'p-2 border-2 border-slate-200 bg-white text-slate-600 font-bold text-sm rounded-xl transition';
                }
            });
            renderAvatarSvg();
        }

        function openAvatarModal() {
            document.getElementById('avatarModal').classList.remove('hidden');
        }

        function closeAvatarModal() {
            document.getElementById('avatarModal').classList.add('hidden');
        }

        /* Arithmetic Problem Generator */
        function generateProblem(level) {
            let num1, num2;

            if (level === 1) { // 2D x 1D
                num1 = Math.floor(Math.random() * 80) + 12; // 12~91
                num2 = Math.floor(Math.random() * 8) + 2;   // 2~9
            } else if (level === 2) { // 3D x 1D
                num1 = Math.floor(Math.random() * 800) + 112; // 112~911
                num2 = Math.floor(Math.random() * 8) + 2;
            } else if (level === 3) { // 4D x 1D
                num1 = Math.floor(Math.random() * 8000) + 1112;
                num2 = Math.floor(Math.random() * 8) + 2;
            }

            return solveProblemData(num1, num2);
        }

        /* Calculate exact vertical step solution */
        function solveProblemData(num1, num2) {
            const num1Str = num1.toString();
            const num2Str = num2.toString();

            // Single-digit multiplier mode (1D) vs Two-digit multiplier (2D)
            const isTwoDigitMultiplier = num2Str.length === 2;

            if (!isTwoDigitMultiplier) {
                const multiplier = parseInt(num2Str, 10);
                const digits1 = num1Str.split('').map(Number); // left to right e.g. [3, 8, 4]
                const len = digits1.length;

                // Carry circles and Answer digits calculation
                let carries = new Array(len).fill(0); // carry generated at step i
                let answers = []; // answer digit from right to left

                let currentCarry = 0;
                for (let i = len - 1; i >= 0; i--) {
                    const prod = digits1[i] * multiplier + currentCarry;
                    const ansDigit = prod % 10;
                    currentCarry = Math.floor(prod / 10);
                    answers.push(ansDigit);
                    carries[i] = currentCarry; // carry to next column
                }

                // If highest step generated carry, it goes straight to answer row!
                if (currentCarry > 0) {
                    answers.push(currentCarry);
                }

                return {
                    num1,
                    num2,
                    isTwoDigit: false,
                    digits1,
                    multiplier,
                    carries, // carries[len-1] is carry from units to tens, carries[len-2] is carry from tens to hundreds, etc.
                    answers, // answers[0] = units, answers[1] = tens, etc.
                    totalAnswer: num1 * num2
                };
            }
        }

        /* Render Workspace HTML based on Problem Data */
        function renderMathWorkspace() {
            const workspace = document.getElementById('mathWorkspace');
            workspace.innerHTML = '';
            inputFocusOrder = [];
            currentFocusIndex = 0;
            isCorrectionMode = false;

            const prob = currentProblem;

            if (!prob.isTwoDigit) {
                // 1-Digit Multiplier Layout
                const num1Str = prob.num1.toString();
                const num2Str = prob.num2.toString();
                const totalAnsLen = prob.totalAnswer.toString().length;

                // Max grid columns needed = totalAnsLen + 1
                const cols = Math.max(totalAnsLen + 1, num1Str.length + 2);

                // Row 1: Multiplicand A
                let r1Html = `<div class="math-grid mb-1">`;
                for (let c = 0; c < cols; c++) {
                    const digitIndex = num1Str.length - (cols - c);
                    const val = (digitIndex >= 0 && digitIndex < num1Str.length) ? num1Str[digitIndex] : '';
                    r1Html += `<div class="w-[3.2rem] sm:w-[3.2rem] text-center font-black text-2xl text-slate-800">${val}</div>`;
                }
                r1Html += `</div>`;

                // Row 2: Multiplier B (with x sign)
                let r2Html = `<div class="math-grid mb-2">`;
                for (let c = 0; c < cols; c++) {
                    if (c === cols - num1Str.length - 1) {
                        r2Html += `<div class="w-[3.2rem] text-center font-black text-2xl text-amber-600">×</div>`;
                    } else if (c === cols - 1) {
                        r2Html += `<div class="w-[3.2rem] text-center font-black text-2xl text-slate-800">${num2Str}</div>`;
                    } else {
                        r2Html += `<div class="w-[3.2rem]"></div>`;
                    }
                }
                r2Html += `</div>`;

                // Horizontal Line with Overlay Carry Circles ◯
                // Carry circles are placed above columns between right and left!
                let carryRowHtml = `<div class="math-grid relative my-1">`;
                for (let c = 0; c < cols; c++) {
                    // Carry for digit column c
                    // Units column is at c = cols - 1. Carry from units to tens goes to c = cols - 2
                    const colFromRight = cols - 1 - c; 
                    // Carry needed if colFromRight > 0 and colFromRight <= prob.digits1.length - 1
                    if (colFromRight > 0 && colFromRight < prob.digits1.length) {
                        const carryVal = prob.carries[prob.digits1.length - colFromRight];
                        const inputId = `carry_${colFromRight}`;
                        
                        carryRowHtml += `
                            <div class="flex items-center justify-center">
                                <input type="text" id="${inputId}" maxlength="1" inputmode="numeric" 
                                       data-expected="${carryVal}"
                                       class="carry-input border-2 border-amber-400 bg-amber-50/80 text-amber-900 focus:bg-white focus:ring-2 focus:ring-amber-500 shadow-xs"
                                       placeholder="◯" autocomplete="off"/>
                            </div>
                        `;
                    } else {
                        carryRowHtml += `<div class="w-[3.2rem]"></div>`;
                    }
                }
                carryRowHtml += `</div>`;

                // Solid Divider Line
                const dividerHtml = `<div class="w-full h-1 bg-slate-800 rounded-full my-1"></div>`;

                // Row 3: Answer Inputs [ ] (Right to Left)
                let ansRowHtml = `<div class="math-grid mt-2">`;
                for (let c = 0; c < cols; c++) {
                    const colFromRight = cols - 1 - c;
                    if (colFromRight < totalAnsLen) {
                        const expectedDigit = prob.answers[colFromRight];
                        const inputId = `ans_${colFromRight}`;

                        ansRowHtml += `
                            <div class="flex items-center justify-center">
                                <input type="text" id="${inputId}" maxlength="1" inputmode="numeric" 
                                       data-expected="${expectedDigit}"
                                       class="digit-box border-2 border-slate-300 bg-white text-slate-900 focus:border-amber-500 focus:ring-2 focus:ring-amber-400 shadow-sm"
                                       placeholder="" autocomplete="off"/>
                            </div>
                        `;
                    } else {
                        ansRowHtml += `<div class="w-[3.2rem]"></div>`;
                    }
                }
                ansRowHtml += `</div>`;

                workspace.innerHTML = r1Html + r2Html + carryRowHtml + dividerHtml + ansRowHtml;

                // Define Right-To-Left Focus Order
                // Sequence: [ans_0, carry_1 (if exists), ans_1, carry_2 (if exists), ans_2, ans_3...]
                inputFocusOrder = [];
                for (let i = 0; i < totalAnsLen; i++) {
                    inputFocusOrder.push(`ans_${i}`);
                    if (i + 1 < prob.digits1.length) {
                        inputFocusOrder.push(`carry_${i + 1}`);
                    }
                }

            }

            // Attach Event Listeners & Focus First Field
            attachInputListeners();
            focusIndex(0);
        }

        /* Focus Manager & Keyboard Handling */
        function focusIndex(idx) {
            if (idx < 0 || idx >= inputFocusOrder.length) return;

            currentFocusIndex = idx;
            const fieldId = inputFocusOrder[currentFocusIndex];
            const el = document.getElementById(fieldId);

            if (el) {
                // If this is a carry circle and expected value is '0', auto skip if requested or focus smoothly
                const expected = el.dataset.expected;
                if (fieldId.startsWith('carry_') && expected === '0' && !isCorrectionMode) {
                    // Automatically skip zero carry
                    if (currentFocusIndex + 1 < inputFocusOrder.length) {
                        focusIndex(currentFocusIndex + 1);
                        return;
                    }
                }

                el.focus();
                el.select();
            }
        }

        function attachInputListeners() {
            inputFocusOrder.forEach((id, idx) => {
                const el = document.getElementById(id);
                if (!el) return;

                el.addEventListener('focus', () => {
                    currentFocusIndex = idx;
                });

                el.addEventListener('input', (e) => {
                    const val = e.target.value.trim();
                    playSound('key');

                    // Filter non-digit
                    if (val && !/^\d$/.test(val)) {
                        e.target.value = '';
                        return;
                    }

                    // Live auto-check if in correction mode or normal completion
                    liveValidateCheck();

                    // Advance focus to next input if digit entered
                    if (val.length === 1) {
                        if (currentFocusIndex + 1 < inputFocusOrder.length) {
                            focusIndex(currentFocusIndex + 1);
                        }
                    }
                });

                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !el.value) {
                        // Move to previous focus input
                        if (currentFocusIndex - 1 >= 0) {
                            focusIndex(currentFocusIndex - 1);
                        }
                    } else if (e.key === 'ArrowLeft') {
                        if (currentFocusIndex + 1 < inputFocusOrder.length) {
                            focusIndex(currentFocusIndex + 1);
                        }
                    } else if (e.key === 'ArrowRight') {
                        if (currentFocusIndex - 1 >= 0) {
                            focusIndex(currentFocusIndex - 1);
                        }
                    } else if (e.key === 'Enter') {
                        checkCurrentAnswer();
                    }
                });
            });
        }

        function pressKey(numStr) {
            const fieldId = inputFocusOrder[currentFocusIndex];
            const el = document.getElementById(fieldId);
            if (el) {
                el.value = numStr;
                playSound('key');
                liveValidateCheck();

                if (currentFocusIndex + 1 < inputFocusOrder.length) {
                    focusIndex(currentFocusIndex + 1);
                }
            }
        }

        function pressBackspace() {
            const fieldId = inputFocusOrder[currentFocusIndex];
            const el = document.getElementById(fieldId);
            if (el) {
                if (el.value) {
                    el.value = '';
                    playSound('key');
                    liveValidateCheck();
                } else if (currentFocusIndex - 1 >= 0) {
                    focusIndex(currentFocusIndex - 1);
                    const prevEl = document.getElementById(inputFocusOrder[currentFocusIndex]);
                    if (prevEl) {
                        prevEl.value = '';
                        playSound('key');
                        liveValidateCheck();
                    }
                }
            }
        }

        /* Answer Validation Engine with Strict Correction Preservation */
        function checkCurrentAnswer() {
            let allCorrect = true;
            let hasEmpty = false;

            inputFocusOrder.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;

                const val = el.value.trim();
                const expected = el.dataset.expected;

                // Carry 0 can be empty or '0'
                let isFieldCorrect = false;
                if (id.startsWith('carry_') && expected === '0') {
                    if (val === '' || val === '0') isFieldCorrect = true;
                } else {
                    if (val === expected) isFieldCorrect = true;
                }

                if (!val && !(id.startsWith('carry_') && expected === '0')) {
                    hasEmpty = true;
                }

                if (isFieldCorrect) {
                    // Preserve correct input styling (Green border)
                    el.className = el.className.replace(/border-red-500|bg-red-50|animate-shake/g, '');
                    if (id.startsWith('carry_')) {
                        el.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                    } else {
                        el.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                    }
                } else {
                    allCorrect = false;
                    // Mark error in RED, but PRESERVE user text!
                    el.className = el.className.replace(/border-emerald-500|bg-emerald-50/g, '');
                    el.classList.add('border-red-500', 'bg-red-50', 'text-red-700', 'animate-shake');
                    setTimeout(() => el.classList.remove('animate-shake'), 450);
                }
            });

            if (allCorrect) {
                onStepSuccess();
            } else {
                onStepFailure();
            }
        }

        /* Live Validate listener during typing/correcting */
        function liveValidateCheck() {
            if (!isCorrectionMode) return;

            let allCorrect = true;
            inputFocusOrder.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;

                const val = el.value.trim();
                const expected = el.dataset.expected;

                let isFieldCorrect = false;
                if (id.startsWith('carry_') && expected === '0') {
                    if (val === '' || val === '0') isFieldCorrect = true;
                } else {
                    if (val === expected) isFieldCorrect = true;
                }

                if (isFieldCorrect) {
                    el.classList.remove('border-red-500', 'bg-red-50', 'text-red-700');
                    el.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                } else {
                    allCorrect = false;
                }
            });

            if (allCorrect) {
                onStepSuccess();
            }
        }

        /* Success Trigger: Sound, step animation, and immediate next problem */
        function onStepSuccess() {
            playSound('correct');
            isCorrectionMode = false;

            const statusMsg = document.getElementById('statusMessage');
            statusMsg.textContent = '答對了！太棒了！向前爬升！';
            statusMsg.className = 'text-sm font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200';

            // Disable inputs temporarily
            inputFocusOrder.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = true;
            });

            // Advance Step
            currentStep++;
            updateMountainProgress();

            if (currentStep >= totalSteps) {
                triggerSummitVictory();
            } else {
                loadNextQuestion();
            }
        }

        /* Failure Trigger: Add one step and require a correct retry */
        function onStepFailure() {
            playSound('error');
            if (!isCorrectionMode) {
                totalSteps++;
            }
            isCorrectionMode = true;
            document.getElementById('totalStepsText').textContent = totalSteps;

            const statusMsg = document.getElementById('statusMessage');
            statusMsg.textContent = '答錯了！已增加 1 步，請補答正確後再進入下一題！';
            statusMsg.className = 'text-sm font-bold text-rose-600 bg-rose-50 rounded-full border border-rose-200';
        }

        /* SVG Path Traversal Engine using getTotalLength & getPointAtLength */
        function updateMountainProgress() {
            const path = document.getElementById('trailPath');
            const climberGroup = document.getElementById('climberGroup');
            const totalLength = path.getTotalLength();

            // Calculate progress ratio (0.0 to 1.0)
            const ratio = Math.min(currentStep / totalSteps, 1.0);
            const targetLength = ratio * totalLength;

            // Get exact coordinates on the SVG winding trail
            const point = path.getPointAtLength(targetLength);

            // Animate step movement smoothly
            climberGroup.style.transition = 'transform 0.6s ease-out';
            climberGroup.setAttribute('transform', `translate(${point.x}, ${point.y})`);

            // Add bounce animation to avatar container
            const avatarBox = document.getElementById('avatarSvgContainer');
            avatarBox.classList.add('animate-step');
            playSound('step');
            setTimeout(() => avatarBox.classList.remove('animate-step'), 400);

            // Update Altitude Display (0m to 3,952m)
            const currentAlt = Math.round(ratio * 3952);
            document.getElementById('altitudeText').textContent = `${currentAlt.toLocaleString()} m`;
            document.getElementById('currentStepText').textContent = currentStep;
            document.getElementById('totalStepsText').textContent = totalSteps;
        }

        function loadNextQuestion() {
            currentProblem = generateProblem(currentLevel);
            renderMathWorkspace();
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.textContent = '請由個位開始計算';
            statusMsg.className = 'text-sm font-bold text-amber-600 bg-amber-50 px-3 py-1 rounded-full border border-amber-200';
        }

        function changeLevel(levelVal) {
            currentLevel = parseInt(levelVal, 10);
            restartChallenge();
        }

        function restartChallenge() {
            currentStep = 0;
            totalSteps = 10;
            document.getElementById('summitModal').classList.add('hidden');
            updateMountainProgress();
            loadNextQuestion();
        }

        function goToNextLevel() {
            if (currentLevel >= 3) return;
            const nextLevel = currentLevel + 1;
            document.getElementById('levelSelect').value = String(nextLevel);
            changeLevel(nextLevel);
        }

        function triggerSummitVictory() {
            playSound('victory');
            const modal = document.getElementById('summitModal');
            const levelNames = ['第一關', '第二關', '第三關'];
            document.getElementById('modalLevelText').textContent = levelNames[currentLevel - 1];
            document.getElementById('modalCompletedQuestions').textContent = `${currentStep} 題`;
            const nextLevelBtn = document.getElementById('nextLevelBtn');
            if (currentLevel < 3) {
                nextLevelBtn.textContent = `進入${levelNames[currentLevel]}`;
                nextLevelBtn.classList.remove('hidden');
            } else {
                nextLevelBtn.classList.add('hidden');
            }
            modal.classList.remove('hidden');
        }

        /* Initialize Application */
        window.onload = function() {
            renderAvatarSvg();
            updateAvatarUI();
            currentProblem = generateProblem(currentLevel);
            renderMathWorkspace();
            updateMountainProgress();
        };
    </script>
